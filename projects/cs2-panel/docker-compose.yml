version: '3.8'

services:
  mongodb:
    image: mongo:latest
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=cspanel
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mongodb_data: 