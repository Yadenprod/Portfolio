<VirtualHost *:80>
    ServerName mobile-legends.local
    DocumentRoot "D:/ML/html/public"
    
    <Directory "D:/ML/html/public">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    
    ErrorLog "logs/mobile-legends-error.log"
    CustomLog "logs/mobile-legends-access.log" combined
</VirtualHost> 