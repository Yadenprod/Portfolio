# Virtual Host Configuration для Mobile Legends Cases
<VirtualHost *:80>
    ServerName localhost
    DocumentRoot "D:/ML/html/public"
    
    <Directory "D:/ML/html/public">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    
    ErrorLog ${APACHE_LOG_DIR}/mobile-legends-error.log
    CustomLog ${APACHE_LOG_DIR}/mobile-legends-access.log combined
</VirtualHost> 