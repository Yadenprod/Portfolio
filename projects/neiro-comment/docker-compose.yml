version: '3.8'

services:
  neirocomment:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://neirocomment:password@postgres:5432/neirocomment
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - postgres
      - redis
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped

  postgres:
    image: postgres:15
    environment:
      - POSTGRES_DB=neirocomment
      - POSTGRES_USER=neirocomment
      - POSTGRES_PASSWORD=password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - neirocomment
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
